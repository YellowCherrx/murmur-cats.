<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Поймай мышку</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b3a;--pink:#ff8fb1;--soft:#f6f1fd;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fff;color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 10px;padding:12px 16px;font-weight:500;font-size:1rem}
.snd{font:inherit;border:0;background:var(--soft);border-radius:50%;width:38px;height:38px;font-size:1.1rem;cursor:pointer;padding:0}
a{color:var(--ink)}
main{flex:1;display:grid;place-items:center;padding:8px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:3vmin;width:min(92vw,420px)}
.hole{position:relative;aspect-ratio:1;border:0;background:none;padding:0;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.hole::before{content:"";position:absolute;left:6%;right:6%;bottom:6%;height:38%;border-radius:50%;background:#5b3f73}
.m{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:min(15vw,68px);line-height:1;transform:translateY(120%);transition:transform .1s;pointer-events:none}
.hole.up .m{transform:translateY(0)}
.ov{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:24px;background:rgba(255,255,255,.93)}
.ov[hidden]{display:none}
h1{margin:0;font-size:2.2rem}
p{margin:0;max-width:30ch;color:#6b6890}
button.go{font:inherit;font-weight:500;font-size:1.2rem;border:0;border-radius:999px;padding:14px 30px;background:var(--pink);color:var(--ink);cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.m{transition:none}}
</style></head>
<body>
<header><a href="index.html">← Главная</a><span id="sc">Очки: 0</span><span id="tm">⏱ 30</span><button class="snd" id="snd" aria-label="Выключить звук">🔊</button></header>
<main><div class="board" id="board"></div></main>
<div class="ov" id="ov"><h1 id="t">Поймай мышку 🐭</h1><p id="d">Тапай по мышкам! Сыр 🧀 даёт 3 очка, а огурцов 🥒 кот боится: за них минус 2.</p><button class="go" id="go">Играть</button></div>
<script>
var AC=null,mute=false;try{mute=localStorage.getItem("mute")==="1"}catch(e){}
function tone(f1,f2,d,type,vol,delay){
  if(mute)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
var ls=-1;
var LEN=30,board=document.getElementById("board"),ov=document.getElementById("ov");
var K={mouse:{e:"🐭",p:1},cheese:{e:"🧀",p:3},cuc:{e:"🥒",p:-2}};
var best=0;try{best=+localStorage.getItem("miceBest")||0}catch(e){}
var holes=[],st=[],score=0,run=false,t0=0,next=0,timer=null;
for(var i=0;i<9;i++){
  (function(i){
    var b=document.createElement("button");b.className="hole";b.setAttribute("aria-label","Норка "+(i+1));
    b.innerHTML='<span class="m"></span>';
    b.addEventListener("pointerdown",function(e){e.preventDefault();hit(i)});
    board.appendChild(b);holes.push(b);st.push(null);
  })(i);
}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function hide(i){holes[i].classList.remove("up");st[i]=null}
function spawn(el,now){
  var free=[];for(var i=0;i<9;i++)if(!st[i])free.push(i);
  if(!free.length)return;
  var i=free[Math.floor(Math.random()*free.length)],r=Math.random(),k=r<.12?"cheese":r<.28?"cuc":"mouse";
  var d=Math.max(500,1100-el*20)*(k==="cheese"?.75:1);
  holes[i].querySelector(".m").textContent=K[k].e;
  holes[i].classList.add("up");st[i]={k:k,end:now+d,done:false};
}
function hit(i){
  var s=st[i];if(!run||!s||s.done)return;
  s.done=true;score=Math.max(0,score+K[s.k].p);
  if(s.k==="mouse"){tone(1500,2400,.07,"square",.1);tone(1900,1300,.08,"square",.08,.06)}else if(s.k==="cheese"){tone(988,988,.1,"sine",.2);tone(1319,1319,.22,"sine",.2,.1)}else{tone(220,70,.25,"triangle",.3)}
  holes[i].querySelector(".m").textContent=s.k==="cuc"?"💢":"⭐";
  vib(s.k==="cuc"?60:15);document.getElementById("sc").textContent="Очки: "+score;
  setTimeout(function(){hide(i)},180);
}
function tick(){
  var now=Date.now(),el=(now-t0)/1000,left=Math.max(0,LEN-el);
  if(now>=next){spawn(el,now);next=now+Math.max(260,720-el*14)}
  for(var i=0;i<9;i++)if(st[i]&&!st[i].done&&now>st[i].end)hide(i);
  var c=Math.ceil(left);document.getElementById("tm").textContent="⏱ "+c;if(c!==ls){ls=c;if(c<=3&&c>0)tone(900,900,.06,"sine",.12)}
  if(left<=0)finish();
}
function start(){
  for(var i=0;i<9;i++)hide(i);
  score=0;run=true;ls=-1;t0=Date.now();next=t0+400;ov.hidden=true;tone(523,784,.12,"sine",.2);tone(784,1047,.16,"sine",.2,.12);
  document.getElementById("sc").textContent="Очки: 0";
  clearInterval(timer);timer=setInterval(tick,50);
}
function finish(){
  run=false;clearInterval(timer);
  tone(523,523,.12,"sine",.2);tone(659,659,.12,"sine",.2,.12);tone(784,784,.12,"sine",.2,.24);tone(1047,1047,.3,"sine",.2,.36);
  for(var i=0;i<9;i++)hide(i);
  if(score>best){best=score;try{localStorage.setItem("miceBest",best)}catch(e){}}
  document.getElementById("t").textContent="Время вышло!";
  document.getElementById("d").textContent="Твои очки: "+score+". Рекорд: "+best+".";
  document.getElementById("go").textContent="Ещё раз";ov.hidden=false;
}
document.getElementById("go").addEventListener("click",start);
var sb=document.getElementById("snd");
function paint(){sb.textContent=mute?"🔇":"🔊";sb.setAttribute("aria-label",mute?"Включить звук":"Выключить звук")}
paint();
sb.addEventListener("click",function(){mute=!mute;try{localStorage.setItem("mute",mute?"1":"0")}catch(e){}paint();if(!mute)tone(700,1000,.08,"sine",.2)});
</script></body></html>
