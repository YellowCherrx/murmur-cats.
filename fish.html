<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лови рыбок</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b3a;--pink:#ff8fb1;--soft:#f6f1fd;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#fff;color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;font-weight:500;font-size:1.1rem}
a{color:var(--ink)}
.snd{font:inherit;border:0;background:var(--soft);border-radius:50%;width:38px;height:38px;font-size:1.1rem;cursor:pointer;padding:0}
.bar{height:10px;background:var(--soft);margin:0 16px 8px;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff8fb1,#ffd166);transition:width .15s}
canvas{flex:1;min-height:0;width:100%;display:block;touch-action:none;background:#2a1a5e}
.ov{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:24px;background:rgba(30,16,70,.82);color:#fff}
.ov[hidden]{display:none}
h1{margin:0;font-size:2.2rem}
p{margin:0;max-width:32ch;color:#e8defa}
.go{font:inherit;font-weight:500;font-size:1.2rem;border:0;border-radius:999px;padding:14px 30px;background:var(--pink);color:var(--ink);cursor:pointer;display:inline-block;text-decoration:none}
a.go,.go.sec{background:var(--soft)}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style></head>
<body>
<header><a href="index.html">← Главная</a><span id="sc">0</span><button class="snd" id="snd" aria-label="Выключить звук">🔊</button></header>
<div class="bar"><i id="hp"></i></div>
<canvas id="c"></canvas>
<div class="ov" id="ov"><h1 id="t">Лови рыбок 🐟</h1><p id="d">Води котом пальцем и лови рыбок в такт музыке. Креветки 🦐 дают бонус. Промах по рыбке отнимает здоровье и комбо. Игра бесконечная: чем дольше играешь, тем быстрее и плотнее рыбки.</p><button class="go" id="go">Играть</button><button class="go sec" id="rank">🏆 Рейтинг</button><a class="go" href="index.html">На главную</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="cloud.js?v=6"></script>
<script>
var AC=null,master=null,mute=false;try{mute=localStorage.getItem("mute")==="1"}catch(e){}
function audio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=mute?0:1;master.connect(AC.destination)}if(AC.state==="suspended")AC.resume()}catch(e){AC=null}return AC}
function tone(f1,f2,d,type,vol,at,dst){
  if(!audio())return;
  var t=at==null?AC.currentTime:at,o=AC.createOscillator(),gn=AC.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(vol||.2,t+.01);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(gn);gn.connect(dst||master);o.start(t);o.stop(t+d+.02);
}
var SC=[523.25,587.33,659.25,783.99,880],BASS=[65.41,65.41,87.31,98];
var FALL=1.25,BPM=112,B=60/BPM,LEAD=2,STEPS=184,PAD=28;
var cv=document.getElementById("c"),g=cv.getContext("2d"),W=1,H=1,stars=[];
function size(){
  var d=window.devicePixelRatio||1,r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);
  stars=[];for(var i=0;i<55;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.55,s:1+Math.random()*1.6,p:Math.random()*6});
}
addEventListener("resize",size);size();
var best=0;try{best=+localStorage.getItem("fishBest2")||0}catch(e){}
var ov=document.getElementById("ov"),sc=document.getElementById("sc"),hpEl=document.getElementById("hp");
var notes=[],ni=0,act=[],parts=[],ct=0,t0a=0,t0p=0,lastP=0,run=false,sg=null,gt=0,gx=.5,mb=-3,lvl=1,seen=0,banner=null;
var score=0,combo=0,maxc=0,hp=100,hits=0,total=0,tx=.5,cx=.5,pulse=0,lastBeat=-9,keys={l:0,r:0,s:0};
var cl=0,clGap=.5,lg=2;
function lvlAt(t){return Math.max(1,Math.floor((t-LEAD)/20)+1)}
function step(a,b){var d=a+Math.random()*Math.max(.04,b-a),s=Math.random()<.5?-1:1,n=gx+s*d;if(n<.08||n>.92)n=gx-s*d;return Math.max(.08,Math.min(.92,n))}
function gen(){
  var L=lvlAt(LEAD+gt*B/2),gap,rg,far=false,ox=gx,inCl=false;
  if(gt<16){gap=2;rg=.4}
  else if(cl>0){gap=clGap;rg=.32;inCl=true;cl--}
  else{
    var r=Math.random(),p05=L>=4?Math.min(.5,(L-3)*.07):0,p1=Math.min(.5,.2+L*.05);
    gap=r<p05?.5:r<p05+p1?1:2;
    rg=gap===2?Math.min(.95,.4+L*.07):gap===1?Math.min(.6,.18+L*.05):Math.min(.3,.1+L*.025);
    if(L>=7&&Math.random()<Math.min(.9,.45+(L-7)*.1)){
      far=true;gap=1;
      cl=L>=10?Math.min(16,7+L-9+Math.floor(Math.random()*4)):3+Math.floor((L-7)*1.2);
      clGap=L>=10?.35:.6;
    }
  }
  if(far&&lg<1)gt+=1-lg;
  var tL=LEAD+gt*B/2;
  if(far)gx=ox<.5?.62+Math.random()*.33:.05+Math.random()*.33;
  else gx=step(inCl||gt<16?.14:gap===2?.15+L*.01:gap===1?.12+L*.008:.14,rg);
  var f=Math.max(.7,1.25-.06*(L-1));
  notes.push({t:tL,x:gx,k:"f",f:f,w:gap<=.35?.3:gap<=.6?.6:1});
  if(gap===2&&gt>=16)notes.push({t:tL+B/2,x:Math.max(.08,Math.min(.92,gx+(Math.random()-.5)*.3)),k:"s",f:f});
  gt+=gap;lg=gap;
}
function sched(k){
  var t=t0a+LEAD+k*B,L=lvlAt(LEAD+k*B);
  var o=AC.createOscillator(),gn=AC.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  gn.gain.setValueAtTime(.5,t);gn.gain.exponentialRampToValueAtTime(.001,t+.16);
  o.connect(gn);gn.connect(sg);o.start(t);o.stop(t+.2);
  tone(6000,5000,.03,"square",.025,t+B/2,sg);
  if(L>=3){tone(6000,5000,.02,"square",.018,t+B/4,sg);tone(6000,5000,.02,"square",.018,t+3*B/4,sg)}
  if(k>=0&&k%2===0){var bf=BASS[Math.floor(k/4)%4]*(L>=5?1.122:1);tone(bf,bf,B*1.6,"triangle",.28,t,sg)}
  if(k>=8)for(var j=0;j<2;j++){var i=2*k+j,nf=SC[(i*3+(i>>3))%5]*(L>=4&&j?2:1);tone(nf,nf,.22,"triangle",.05,t+j*B/2,sg)}
  if(L>=6){var sf=SC[(k*2)%5]*2;tone(sf,sf,.1,"sine",.04,t+B*.75,sg)}
}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function start(){
  size();audio();notes=[];ni=0;act=[];parts=[];score=0;combo=0;maxc=0;hp=100;hits=0;seen=0;tx=cx=.5;lastBeat=-9;gt=0;gx=.5;mb=-3;lvl=1;banner=null;cl=0;lg=2;
  if(AC){t0a=AC.currentTime+.25;sg=AC.createGain();sg.connect(master)}else t0p=performance.now()+250;
  lastP=performance.now();run=true;ov.hidden=true;sc.textContent="Ур. 1 · 0";hpEl.style.width="100%";
}
function finish(){
  run=false;act=[];
  if(sg){sg.gain.cancelScheduledValues(0);sg.gain.value=0;sg=null}
  var cl=window.Cloud;if(cl)best=Math.max(best,cl.data.fishBest||0);
  if(score>best){best=score;try{localStorage.setItem("fishBest2",best)}catch(e){}}
  if(cl){if(score>=(cl.data.fishBest||0))cl.data.fishLevel=lvl;cl.data.fishBest=Math.max(cl.data.fishBest||0,score);cl.data.fishMaxLevel=Math.max(cl.data.fishMaxLevel||0,lvl);cl.data.fishCombo=Math.max(cl.data.fishCombo||0,maxc);cl.save(true);cl.submitScore(cl.data.fishBest,cl.data.fishLevel)}
  var acc=seen?Math.round(hits/seen*100):0;
  document.getElementById("t").textContent="Кот проголодался";
  document.getElementById("d").textContent="Уровень "+lvl+". Очки: "+score+". Рекорд: "+best+". Макс. комбо: "+maxc+". Поймано рыбок: "+hits+" из "+seen+" ("+acc+"%).";
  document.getElementById("go").textContent="Ещё раз";ov.hidden=false;
  [520,400,300].forEach(function(f,i){tone(f,f*.6,.25,"triangle",.22,AC?AC.currentTime+i*.2:null)});
}
function burst(x,y,c){for(var i=0;i<7;i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*260,vy:-Math.random()*220,l:.5,c:c})}
function update(dt){
  ct=AC?AC.currentTime-t0a:(performance.now()-t0p)/1000;
  tx=Math.max(0,Math.min(1,tx+(keys.r-keys.l)*(keys.s?2.2:1.1)*dt));
  cx+=(tx-cx)*Math.min(1,dt*20);
  var bn=Math.floor((ct-LEAD)/B);if(bn!==lastBeat){lastBeat=bn;pulse=1}
  var cw=Math.max(46,W*.09),px=PAD+cx*(W-2*PAD);
  var L=lvlAt(ct);
  if(L!==lvl){lvl=L;if(L>1){banner={t:1.6,s:L===7?"Уровень 7: рыбки разлетаются!":L===10?"Уровень 10: рыбный дождь!":"Уровень "+L+"!"};tone(659,988,.15,"triangle",.2);tone(988,1319,.2,"triangle",.2,AC?AC.currentTime+.12:null)}}
  if(banner)banner.t-=dt;
  while(LEAD+gt*B/2<ct+10)gen();
  if(AC&&sg)while(t0a+LEAD+mb*B<AC.currentTime+3)sched(mb++);
  if(ni>300){notes.splice(0,ni);ni=0}
  while(ni<notes.length&&notes[ni].t-notes[ni].f<=ct)act.push(notes[ni++]);
  for(var i=act.length-1;i>=0;i--){
    var a=act[i],ax=PAD+a.x*(W-2*PAD),y=(H-96)*((ct-(a.t-a.f))/a.f);
    if(!a.r&&ct>=a.t){
      a.r=1;
      if(Math.abs(ax-px)<cw+(a.k==="s"?0:12)){
        if(a.k==="s"){score+=10;hp=Math.min(100,hp+1);tone(1760,1760,.05,"sine",.08)}
        else{hits++;seen++;combo++;maxc=Math.max(maxc,combo);score+=(a.k==="g"?500:100)+Math.floor(combo/10)*20;hp=Math.min(100,hp+3*(a.w||1));tone(SC[Math.floor(a.x*5)],SC[Math.floor(a.x*5)],.16,"triangle",.22);vib(10)}
        burst(ax,H-96,a.k==="s"?"#ffb3c6":"#ffd166");act.splice(i,1);continue;
      }else if(a.k!=="s"){seen++;combo=0;hp-=(12+Math.min(10,lvl))*(a.w||1);tone(220,110,.25,"sawtooth",.14);vib(40)}
    }
    if(y>H+40)act.splice(i,1);
  }
  parts.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt});parts=parts.filter(function(p){return p.l>0});
  pulse=Math.max(0,pulse-dt*3);
  sc.textContent="Ур. "+lvl+" · "+score;hpEl.style.width=Math.max(0,hp)+"%";
  if(hp<=0)finish();
}
function draw(){
  var now=performance.now()/1000,cw=Math.max(46,W*.09),px=PAD+cx*(W-2*PAD),cy=H-96;
  var s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,"#241552");s.addColorStop(.55,"#8a3ea5");s.addColorStop(1,"#ff8fb1");
  g.fillStyle=s;g.fillRect(0,0,W,H);
  stars.forEach(function(t){g.globalAlpha=.35+.35*Math.sin(now*2+t.p)+pulse*.2;g.fillStyle="#fff";g.beginPath();g.arc(t.x,t.y,t.s,0,7);g.fill()});
  g.globalAlpha=1;
  var mr=Math.min(W,H)*.07,mx=W*.8,my=H*.17,rg=g.createRadialGradient(mx,my,mr*.6,mx,my,mr*(2.4+pulse*.6));
  rg.addColorStop(0,"rgba(255,244,214,.55)");rg.addColorStop(1,"rgba(255,244,214,0)");
  g.fillStyle=rg;g.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);
  g.fillStyle="#fff4d6";g.beginPath();g.arc(mx,my,mr,0,7);g.fill();
  for(var c=0;c<4;c++){
    var cl=((now*(10+c*6)+c*180)%(W+300))-150,cyy=H*(.28+c*.12);
    g.fillStyle="rgba(255,255,255,.16)";
    [[0,0,70,18],[40,-8,50,16],[-40,-4,46,14]].forEach(function(e){g.beginPath();g.ellipse(cl+e[0],cyy+e[1],e[2],e[3],0,0,7);g.fill()});
  }
  function wave(col,y0,amp,sp,ph){g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(var x=0;x<=W;x+=12)g.lineTo(x,y0+Math.sin(x*.03+now*sp+ph)*amp);g.lineTo(W,H);g.closePath();g.fill()}
  wave("#3a1c7a",H-46,5,1.5,1);
  var by=H-38+Math.sin(now*2)*2.5,hw=cw*1.15;
  g.strokeStyle="#f5a65b";g.lineWidth=8;g.lineCap="round";
  g.beginPath();g.moveTo(px-16,by-8);g.lineTo(px-cw*.72,cy-2);g.moveTo(px+16,by-8);g.lineTo(px+cw*.72,cy-2);g.stroke();
  g.textAlign="center";g.textBaseline="middle";g.font="54px serif";g.fillText("🐱",px,by-22);
  g.fillStyle="#8a5a3c";g.beginPath();g.moveTo(px-hw,by-4);g.lineTo(px+hw,by-4);
  g.quadraticCurveTo(px+hw*.85,by+26,px+hw*.45,by+26);g.lineTo(px-hw*.45,by+26);g.quadraticCurveTo(px-hw*.85,by+26,px-hw,by-4);g.fill();
  g.fillStyle="#c98b5a";g.fillRect(px-hw,by-4,hw*2,5);
  g.fillStyle="#ff8fb1";g.fillRect(px-hw*.8,by+8,hw*1.6,4);
  g.strokeStyle="#fff";g.fillStyle="#ff8fb1";g.lineWidth=4+pulse*3;
  g.beginPath();g.ellipse(px,cy-4,cw,cw*.22,0,0,Math.PI);g.closePath();g.fill();g.stroke();
  g.fillStyle="#f5a65b";[-1,1].forEach(function(s){g.beginPath();g.arc(px+s*cw*.72,cy-2,8,0,7);g.fill()});
  wave("#2a1560",H-24,4,2.2,0);
  if(combo>=5){g.globalAlpha=.2;g.fillStyle="#fff";g.font="bold 90px Fredoka,sans-serif";g.fillText(combo,W/2,H*.4);g.globalAlpha=1}
  if(banner&&banner.t>0){g.globalAlpha=Math.min(1,banner.t);g.fillStyle="#fff";g.font="bold "+(banner.s.length>14?26:44)+"px Fredoka,sans-serif";g.fillText(banner.s,W/2,H*.22);g.globalAlpha=1}
  act.forEach(function(a){
    var ax=PAD+a.x*(W-2*PAD),y=cy*((ct-(a.t-a.f))/a.f);
    g.font=a.k==="s"?"22px serif":a.k==="g"?"52px serif":"40px serif";g.fillText(a.k==="s"?"🦐":a.k==="g"?"🐠":"🐟",ax,y);
  });
  parts.forEach(function(p){g.globalAlpha=Math.max(0,p.l*2);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,4,0,7);g.fill()});
  g.globalAlpha=1;
}
function frame(){
  var n=performance.now(),dt=Math.min(.05,(n-lastP)/1000);lastP=n;
  if(run)update(dt);draw();requestAnimationFrame(frame);
}
lastP=performance.now();frame();
function mv(e){var r=cv.getBoundingClientRect();tx=Math.max(0,Math.min(1,(e.clientX-r.left-PAD)/(W-2*PAD)))}
cv.addEventListener("pointermove",mv);cv.addEventListener("pointerdown",mv);
addEventListener("keydown",function(e){if(e.key==="ArrowLeft")keys.l=1;if(e.key==="ArrowRight")keys.r=1;if(e.key==="Shift")keys.s=1});
addEventListener("keyup",function(e){if(e.key==="ArrowLeft")keys.l=0;if(e.key==="ArrowRight")keys.r=0;if(e.key==="Shift")keys.s=0});
document.addEventListener("visibilitychange",function(){if(!AC||!run)return;if(document.hidden)AC.suspend();else AC.resume()});
document.getElementById("go").addEventListener("click",start);
document.getElementById("rank").addEventListener("click",function(){if(window.Cloud)Cloud.openBoard()});
var sb=document.getElementById("snd");
function paint(){sb.textContent=mute?"🔇":"🔊";sb.setAttribute("aria-label",mute?"Включить звук":"Выключить звук")}
paint();
sb.addEventListener("click",function(){mute=!mute;try{localStorage.setItem("mute",mute?"1":"0")}catch(e){}if(audio())master.gain.value=mute?0:1;paint()});
</script></body></html>
