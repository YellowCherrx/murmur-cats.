<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Мур-мур: сайт про котиков</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b3a;--muted:#6b6890;--line:#ece7f7;--pink:#ff8fb1;--soft:#f6f1fd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:#fff;color:var(--ink);font-family:Fredoka,"Segoe UI",system-ui,sans-serif;line-height:1.4;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;font-weight:700;font-size:1.3rem}
.open{font:inherit;font-weight:500;font-size:1rem;border:0;border-radius:999px;padding:12px 22px;background:var(--pink);color:#1d1b3a;cursor:pointer;transition:transform .12s}
.open:active{transform:scale(.95)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 20px 40px;text-align:center}
#stage{position:relative;width:min(58vw,320px);background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:40px;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit}
#stage svg{display:block;width:100%;height:auto}
.floor{width:min(52vw,280px);height:20px;border-radius:50%;background:rgba(29,27,58,.09);margin-top:-8px}
h1{margin:18px 0 0;font-size:clamp(2rem,6vw,2.8rem);line-height:1.1}
.breed{color:var(--muted);margin:4px 0 0;font-size:1.1rem}
.hint{color:var(--muted);margin:14px 0 0}
.count{margin:6px 0 0;font-weight:500;min-height:1.4em}
.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;background:rgba(29,27,58,.45);display:grid;place-items:center;padding:20px;z-index:10}
.panel{background:#fff;border-radius:28px;width:min(720px,100%);max-height:86vh;overflow:auto;padding:20px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ph h2{margin:0;font-size:1.6rem}
.x{font:inherit;border:0;background:var(--soft);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
button.cat{font:inherit;color:inherit;display:block;width:100%;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:24px;padding:12px;text-align:center;transition:transform .12s,border-color .12s}
button.cat:hover{transform:translateY(-3px)}
button.cat.on{border-color:var(--ink)}
.pic{display:block;border-radius:16px;padding:8px}
.pic svg{display:block;width:100%}
.nm{display:block;font-size:1.15rem;font-weight:700;margin:10px 0 2px}
.ds{display:block;color:var(--muted);font-size:.9rem}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.open.alt{background:var(--soft)}
.gem{display:block;font-size:3.2rem;line-height:1;padding:14px 0;border-radius:16px;background:var(--soft)}
.badge{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:999px;background:var(--pink);font-size:.8rem;font-weight:500}
.soon{text-align:center;color:var(--muted);margin:14px 0 0;min-height:1.4em}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:18px;margin-bottom:10px;text-align:left}
.task .rw{font-size:2rem;min-width:2.4rem;text-align:center}
.task small{display:block;color:var(--muted)}
.task button{font:inherit;font-weight:500;border:0;border-radius:999px;padding:8px 16px;background:var(--pink);color:var(--ink);cursor:pointer}
.task button[disabled]{background:var(--soft);color:var(--muted);cursor:default}
.task.on{border-color:var(--ink)}
.pupil{transition:transform .06s}
#head{transform-origin:110px 172px;transition:transform .18s ease-out}
#face{transition:transform .18s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><span>🐾 Мур-мур</span><div class="hbtns"><button class="open alt" id="aopen" aria-label="Аккаунт">👤</button><button class="open alt" id="topen" aria-haspopup="dialog">🏆 Задания</button><button class="open alt" id="gopen" aria-haspopup="dialog">🎮 Игры</button><button class="open" id="open" aria-haspopup="dialog">Каталог котов</button></div></header>

<div class="panel" role="dialog" aria-modal="true" aria-labelledby="ct">
<div class="ph"><h2 id="ct">Каталог котов</h2><button class="x" id="close" aria-label="Закрыть">✕</button></div>
<div class="grid" id="grid"></div>
</div>
</div>

<div class="overlay" id="gmodal" hidden>
<div class="panel" role="dialog" aria-modal="true" aria-labelledby="gt">
<div class="ph"><h2 id="gt">Мини-игры</h2><button class="x" id="gclose" aria-label="Закрыть">✕</button></div>
<div class="grid" id="ggrid"></div>
<p class="soon" id="soon" aria-live="polite"></p>
</div>
</div>
<div class="overlay" id="tmodal" hidden>
<div class="panel" role="dialog" aria-modal="true" aria-labelledby="tt">
<div class="ph"><h2 id="tt">Задания</h2><button class="x" id="tclose" aria-label="Закрыть">✕</button></div>

<p class="soon">Выполняй задания и получай награды для главного кота.</p>
</div>
</div>

// мурчание: шум с низкой частотой, модулированный примерно 25 раз в секунду
var actx;
function purrSynth(){
  try{
    var A=window.AudioContext||window.webkitAudioContext;
    if(!actx)actx=new A();
    var a=actx;if(a.state==="suspended")a.resume();
    var t=a.currentTime,dur=2.4,len=a.sampleRate*2;
    var buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0),last=0;
    for(var i=0;i<len;i++){last=(last+.03*(Math.random()*2-1))/1.03;d[i]=last*6;}
    var src=a.createBufferSource();src.buffer=buf;src.loop=true;
    var lo=a.createBiquadFilter();lo.type="bandpass";lo.frequency.value=110;lo.Q.value=.9;
    var hi=a.createBiquadFilter();hi.type="bandpass";hi.frequency.value=420;hi.Q.value=1.2;
    var hg=a.createGain();hg.gain.value=.9;
    var am=a.createGain();am.gain.value=.55;
    var lfo=a.createOscillator();lfo.frequency.setValueAtTime(23,t);lfo.frequency.linearRampToValueAtTime(26,t+dur);
    var depth=a.createGain();depth.gain.value=.45;lfo.connect(depth);depth.connect(am.gain);
    var env=a.createGain();env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(1,t+.4);env.gain.setValueAtTime(1,t+dur-.9);env.gain.linearRampToValueAtTime(0,t+dur);
    var master=a.createGain();master.gain.value=1.8;
    var comp=a.createDynamicsCompressor();
    src.connect(lo);src.connect(hi);lo.connect(am);hi.connect(hg);hg.connect(am);
    am.connect(env);env.connect(master);master.connect(comp);comp.connect(a.destination);
    src.start(t);lfo.start(t);src.stop(t+dur);lfo.stop(t+dur);

(function(){try{
  actx=new (window.AudioContext||window.webkitAudioContext)();
  var bin=atob(PURR_B64),u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  actx.decodeAudioData(u.buffer,function(b){pbuf=b},function(){});
}catch(e){}})();
// настоящее мурчание: зацикленная запись, пока гладишь; затихает через пару секунд
function purr(){
  if(!pbuf||!actx){purrSynth();return;}
  var a=actx;if(a.state==="suspended")a.resume();
  var t=a.currentTime;
  if(!psrc){
    psrc=a.createBufferSource();psrc.buffer=pbuf;psrc.loop=true;
    pgain=a.createGain();pgain.gain.setValueAtTime(0,t);pgain.gain.linearRampToValueAtTime(1,t+.35);
    psrc.connect(pgain);pgain.connect(a.destination);
    psrc.start(t,Math.random()*pbuf.duration);
  }else{
    pgain.gain.cancelScheduledValues(t);pgain.gain.setValueAtTime(pgain.gain.value,t);pgain.gain.linearRampToValueAtTime(1,t+.2);
  }
  clearTimeout(pTimer);
  pTimer=setTimeout(function(){
    var t2=a.currentTime,s=psrc,g=pgain;psrc=null;pgain=null;
    g.gain.cancelScheduledValues(t2);g.gain.setValueAtTime(g.gain.value,t2);g.gain.linearRampToValueAtTime(0,t2+.9);
    s.stop(t2+.95);
  },2200);
}

// поглаживание
// кот жмурится и от него летят сердечки
function burst(){
  var st=document.getElementById("stage"),ev=document.getElementById("eyes"),hp=document.getElementById("happy");
  if(ev&&hp){
    ev.style.display="none";hp.style.display="";clearTimeout(burst.t);
    burst.t=setTimeout(function(){var e=document.getElementById("eyes"),h=document.getElementById("happy");if(e&&h){e.style.display="";h.style.display="none"}},1600);
  }
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var em=["💗","💖","💕","🐾"];
  for(var i=0;i<5;i++){
    var s=document.createElement("span");
    s.textContent=em[Math.floor(Math.random()*em.length)];
    s.style.cssText="position:absolute;left:"+(25+Math.random()*50)+"%;top:30%;font-size:"+(1.2+Math.random()*1)+"rem;pointer-events:none";
    st.appendChild(s);
    var a=s.animate([{transform:"translate(0,0) scale(.5)",opacity:1},{transform:"translate("+((Math.random()-.5)*90)+"px,-"+(90+Math.random()*80)+"px) scale(1.2)",opacity:0}],{duration:1200+Math.random()*600,delay:i*90,easing:"ease-out",fill:"both"});
    a.onfinish=(function(el){return function(){el.remove()}})(s);
  }
}
function look(x,y){
  var r=document.getElementById("stage").getBoundingClientRect();
  var dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,m=Math.min(1,d/260);
  var nx=dx/d*m,ny=dy/d*m,hd=document.getElementById("head"),fc=document.getElementById("face");
  if(hd)hd.style.transform="translate("+nx*8+"px,"+ny*5+"px) rotate("+nx*10+"deg)";
  if(fc)fc.style.transform="translate("+nx*9+"px,"+ny*6+"px)";
  pupils.forEach(function(p){p.style.transform="translate("+nx*4+"px,"+ny*4+"px)"});
}

var CL=window.Cloud||{data:{},save:function(){},onChange:function(){},openLogin:function(){alert("Вход недоступен")}};
var TASKS=window.TASKS||[];
function isDone(k){return (CL.data[k.k]||0)>=k.n||(CL.data.gifts||"").indexOf(k.h)>-1}
function hatOn(){var h=CL.data.hat;return TASKS.some(function(k){return k.h===h&&isDone(k)})?h:""}
var stage=document.getElementById("stage"),modal=document.getElementById("modal"),countEl=document.getElementById("count");
var pets=cats.map(function(){return 0}),cur=0,pupils=[],lastFocus=null;

document.getElementById("grid").innerHTML=cats.map(function(k){
  return '<button class="cat" aria-label="Выбрать: '+k.n+'"><span class="pic" style="background:'+k.bg+'">'+catSVG(k.c,false)+'</span><span class="nm">'+k.n+'</span><span class="ds">'+k.p+'</span></button>';
}).join("");
var cards=document.querySelectorAll("button.cat");

function updCount(){countEl.textContent="Всего поглаживаний: "+(CL.data.pets||0).toLocaleString("ru-RU")}
function setCat(i){
  cur=i;
  stage.innerHTML=catSVG(cats[i].c,true,hatOn());
  stage.setAttribute("aria-label","Погладить: "+cats[i].n);
  document.getElementById("who").textContent=cats[i].n;
  document.getElementById("breed").textContent=cats[i].p+" · "+cats[i].d;
  pupils=stage.querySelectorAll(".pupil");
  cards.forEach(function(b,j){b.classList.toggle("on",j===i);b.setAttribute("aria-pressed",j===i?"true":"false")});
  updCount();
}
cards.forEach(function(b,j){b.addEventListener("click",function(){setCat(j);closeModal()})});

function openModal(){lastFocus=document.activeElement;modal.hidden=false;document.body.style.overflow="hidden";cards[cur].focus()}
function closeModal(){modal.hidden=true;document.body.style.overflow="";if(lastFocus)lastFocus.focus()}
document.getElementById("open").addEventListener("click",openModal);
document.getElementById("close").addEventListener("click",closeModal);
modal.addEventListener("click",function(e){if(e.target===modal)closeModal()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!modal.hidden)closeModal()});

window.addEventListener("pointermove",function(e){look(e.clientX,e.clientY)});
window.addEventListener("pointerdown",function(e){look(e.clientX,e.clientY)});

stage.addEventListener("click",function(){
  pets[cur]++;CL.data.pets=(CL.data.pets||0)+1;CL.save();updCount();if(CL.syncPets)CL.syncPets();
  var s=stage.querySelector("svg");
  s.animate([{transform:"scale(1)"},{transform:"scale(1.04,.96)"},{transform:"scale(1)"}],{duration:300});
  purr();burst();
});
var tm=document.getElementById("tmodal"),tList=document.getElementById("tlist"),tLast=null;
function renderTasks(){
  var d=CL.data;
  tList.innerHTML=TASKS.map(function(k,i){
    var v=Math.min(d[k.k]||0,k.n),ok=isDone(k),on=d.hat===k.h;
    return '<div class="task'+(on?' on':'')+'"><span class="rw">'+(ok?k.h:'🔒')+'</span><span>'+k.t+'<small>'+v.toLocaleString("ru-RU")+' / '+k.n.toLocaleString("ru-RU")+(ok?' · награда получена':'')+'</small></span><button data-i="'+i+'"'+(ok?'':' disabled')+'>'+(on?'Снять':'Надеть')+'</button></div>';
  }).join("")+(CL.admin?'<div class="task"><span class="rw">🔧</span><span>Режим админа<small>видно только тебе</small></span><span><button data-g="all">Выдать все</button> <button data-g="none">Забрать</button></span></div>':'');
}
tList.addEventListener("click",function(e){
  var g=e.target.closest("button[data-g]");
  if(g&&CL.admin){CL.data.gifts=g.dataset.g==="all"?TASKS.map(function(k){return k.h}).join(""):"";CL.save(true);renderTasks();setCat(cur);return}
  var b=e.target.closest("button[data-i]");if(!b||b.disabled)return;
  var h=TASKS[+b.dataset.i].h;CL.data.hat=CL.data.hat===h?"":h;CL.save(true);renderTasks();setCat(cur);
});
function openT(){tLast=document.activeElement;renderTasks();tm.hidden=false;document.body.style.overflow="hidden";document.getElementById("tclose").focus()}
function closeT(){tm.hidden=true;document.body.style.overflow="";if(tLast)tLast.focus()}
document.getElementById("topen").addEventListener("click",openT);
document.getElementById("tclose").addEventListener("click",closeT);
tm.addEventListener("click",function(e){if(e.target===tm)closeT()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!tm.hidden)closeT()});
document.getElementById("board").addEventListener("click",function(){if(CL.openBoard)CL.openBoard("pets")});
document.getElementById("aopen").addEventListener("click",function(){CL.openLogin()});
var lastHat=hatOn();
CL.onChange(function(){renderTasks();updCount();if(hatOn()!==lastHat){lastHat=hatOn();setCat(cur)}});
var games=[
 {n:"Лови рыбок",e:"🐟",d:"Рыбки падают, кот ловит",f:"fish.html"},
 {n:"Поймай мышку",e:"🐭",d:"Мышки лезут из норок",f:"mice.html"}
];
var gm=document.getElementById("gmodal"),gLast=null,soon=document.getElementById("soon");
document.getElementById("ggrid").innerHTML=games.map(function(g){
  return '<button class="cat" aria-label="'+g.n+'><span class="gem">'+g.e+'</span><span class="nm">'+g.n+'</span><span class="ds">'+g.d+'</span></button>';
}).join("");
document.querySelectorAll("#ggrid button").forEach(function(b,j){
  b.addEventListener("click",function(){location.href=games[j].f});
});
function openG(){gLast=document.activeElement;soon.textContent="";gm.hidden=false;document.body.style.overflow="hidden";document.querySelector("#ggrid button").focus()}
function closeG(){gm.hidden=true;document.body.style.overflow="";if(gLast)gLast.focus()}
document.getElementById("gopen").addEventListener("click",openG);
document.getElementById("gclose").addEventListener("click",closeG);
gm.addEventListener("click",function(e){if(e.target===gm)closeG()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!gm.hidden)closeG()});
setCat(0);
</script>
